services:
    app:
        build: .
        ports:
            - "8080:80"
        env_file:
            - .env.docker
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: app_user
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root_secret
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    db_data: